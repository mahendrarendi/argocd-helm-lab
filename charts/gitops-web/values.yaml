replicaCount: 1

image:
  repository: ghcr.io/nginx/nginx-unprivileged
  tag: "1.30.6-alpine"
  pullPolicy: IfNotPresent

page:
  environment: default
  version: "v1"
  message: "Hello from GitOps!"
  backgroundColor: "#334155"

service:
  port: 80

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
